name: Code Analysis

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: build-tsduck-base

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build with analysis
        run: |
          dotnet build --configuration Release --no-restore \
            -warnaserror \
            /p:TreatWarningsAsErrors=true \
            /p:EnforceCodeStyleInBuild=true \
            /p:TsDuckBaseImage="${{ needs.build-tsduck-base.outputs.image }}"

      - name: Run format check
        run: |
          dotnet format style --verify-no-changes --verbosity diagnostic
          dotnet format analyzers --verify-no-changes --verbosity diagnostic

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: Jellyfin.Xtream/bin/Release/CodeAnalysis.sarif
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Run security scan
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
            echo "::warning::Vulnerable packages detected"
          fi

      - name: Upload vulnerability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-report
          path: vulnerable-packages.txt

  format-check:
    name: Code Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Check code formatting
        id: format
        run: |
          dotnet format style --verify-no-changes --verbosity diagnostic 2>&1 | tee format-output.txt
          STYLE_EXIT=${PIPESTATUS[0]}
          dotnet format analyzers --verify-no-changes --verbosity diagnostic 2>&1 | tee -a format-output.txt
          ANALYZER_EXIT=${PIPESTATUS[0]}
          if [ $STYLE_EXIT -ne 0 ] || [ $ANALYZER_EXIT -ne 0 ]; then
            echo "format_failed=true" >> $GITHUB_OUTPUT
          fi

      - name: Report formatting issues
        if: steps.format.outputs.format_failed == 'true'
        run: |
          echo "::error::Code formatting issues detected. Run 'dotnet format' locally to fix."
          cat format-output.txt
          exit 1

  build-tsduck-base:
    name: Build TsDuck Base Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image-ref.outputs.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read TsDuck version
        id: version
        run: |
          VERSION=$(cat native/tsduck_interop/TSDUCK_VERSION)
          echo "tsduck_version=$VERSION" >> $GITHUB_OUTPUT
          echo "TsDuck version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image reference
        id: image-ref
        run: |
          IMAGE_REF="ghcr.io/${{ github.repository_owner }}/tsduck-base:${{ steps.version.outputs.tsduck_version }}"
          echo "image=$IMAGE_REF" >> $GITHUB_OUTPUT
          echo "Using image reference: $IMAGE_REF"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tsduck-base
          tags: |
            type=raw,value=${{ steps.version.outputs.tsduck_version }}
            type=raw,value=latest

      - name: Build and push TsDuck base image
        uses: docker/build-push-action@v5
        with:
          context: native/tsduck_interop
          file: native/tsduck_interop/Dockerfile.tsduck-base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TSDUCK_VERSION=${{ steps.version.outputs.tsduck_version }}

  native-analysis:
    name: Native C++ Analysis
    runs-on: ubuntu-latest
    needs: build-tsduck-base

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run native static analysis
        run: >-
          docker build
          -f native/tsduck_interop/Dockerfile.analysis
          --target results
          --build-arg TSDUCK_BASE_IMAGE=${{ needs.build-tsduck-base.outputs.image }}
          -o type=local,dest=./native-analysis-results
          .

      - name: Upload native analysis results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-analysis-results
          path: ./native-analysis-results/

  analyzer-summary:
    name: Analyzer Summary
    runs-on: ubuntu-latest
    needs: [analyze, security-scan, format-check, build-tsduck-base, native-analysis]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Code Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Static Analysis (.NET) | ${{ needs.analyze.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅ Passed' || '⚠️ Check logs' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Format Check (.NET) | ${{ needs.format-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Native C++ Analysis | ${{ needs.native-analysis.result == 'success' && '✅ Passed' || '⚠️ Check logs' }} |" >> $GITHUB_STEP_SUMMARY
