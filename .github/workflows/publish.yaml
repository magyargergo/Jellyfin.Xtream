name: "Publish Plugin"

on:
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 0: Build TsDuck base image for the build job
  # ============================================================
  build-tsduck-base:
    name: Build TsDuck Base Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image-ref.outputs.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read TsDuck version
        id: version
        run: |
          VERSION=$(cat native/tsduck_interop/TSDUCK_VERSION)
          echo "tsduck_version=$VERSION" >> $GITHUB_OUTPUT
          echo "TsDuck version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image reference
        id: image-ref
        run: |
          IMAGE_REF="ghcr.io/${{ github.repository_owner }}/tsduck-base:${{ steps.version.outputs.tsduck_version }}"
          echo "image=$IMAGE_REF" >> $GITHUB_OUTPUT
          echo "Using image reference: $IMAGE_REF"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tsduck-base
          tags: |
            type=raw,value=${{ steps.version.outputs.tsduck_version }}
            type=raw,value=latest

      - name: Build and push TsDuck base image
        uses: docker/build-push-action@v5
        with:
          context: native/tsduck_interop
          file: native/tsduck_interop/Dockerfile.tsduck-base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TSDUCK_VERSION=${{ steps.version.outputs.tsduck_version }}

  # ============================================================
  # Build the complete plugin package with native libraries
  # Replaces the reusable JPRM build which only packaged the
  # main DLL without dependencies or native .so files.
  # ============================================================
  build:
    name: Build Plugin Package
    runs-on: ubuntu-latest
    needs: build-tsduck-base
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.*"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build native TsDuck libraries (outputs .so files)
      - name: Build native TsDuck libraries
        run: >-
          docker build
          --target artifacts
          --build-arg TSDUCK_BASE_IMAGE=${{ needs.build-tsduck-base.outputs.image }}
          -o type=local,dest=native/tsduck_interop/output
          native/tsduck_interop

      # Build the .NET plugin (picks up native libs from output/)
      - name: Build plugin
        run: >-
          dotnet build
          --configuration Release
          -p:TreatWarningsAsErrors=true
          -p:BuildNativeLibrary=false

      # Create the release zip matching JPRM naming convention
      - name: Package plugin
        run: |
          # Read version from build.yaml metadata
          VERSION=$(grep '^version:' build.yaml | sed 's/version: *"\?\([^"]*\)"\?/\1/')
          ZIP_NAME="jellyfin-xtream_${VERSION}.zip"

          STAGING=staging

          mkdir -p "$STAGING/runtimes/linux-x64/native"

          BUILD_DIR=Jellyfin.Xtream/bin/Release/net8.0

          # Main plugin DLL
          cp "$BUILD_DIR/Jellyfin.Xtream.dll" "$STAGING/"

          # Required dependencies
          DEPS=(
            "Discord.Net.Core.dll"
            "Discord.Net.Rest.dll"
            "Discord.Net.Webhook.dll"
            "Polly.dll"
            "Polly.Core.dll"
            "AngleSharp.dll"
            "TurboXml.dll"
            "Newtonsoft.Json.dll"
          )

          for dep in "${DEPS[@]}"; do
            if [ -f "$BUILD_DIR/$dep" ]; then
              cp "$BUILD_DIR/$dep" "$STAGING/"
            else
              echo "::error::Missing required dependency: $dep"
              exit 1
            fi
          done

          # Native TsDuck libraries
          cp native/tsduck_interop/output/*.so "$STAGING/runtimes/linux-x64/native/"

          echo "=== Package contents ==="
          find "$STAGING" -type f -exec ls -lh {} \;

          # Create zip from staging directory
          cd "$STAGING"
          zip -r "../$ZIP_NAME" .
          cd ..

          echo "=== Created $ZIP_NAME ==="
          ls -lh "$ZIP_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: jellyfin-xtream_*.zip
          retention-days: 90

  # ============================================================
  # Upload release assets with checksums
  # ============================================================
  upload:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v5
        with:
          name: build-artifact

      - name: Prepare GitHub Release assets
        run: |-
          for file in ./*; do
            md5sum ${file#./} >> ${file%.*}.md5
            sha256sum ${file#./} >> ${file%.*}.sha256
          done
          ls -l

      - name: Upload GitHub Release assets
        uses: shogo82148/actions-upload-release-asset@v1.9.1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./*

  # ============================================================
  # Generate plugin repository manifest
  # ============================================================
  generate:
    runs-on: ubuntu-latest
    needs:
      - upload
    steps:
      - name: Jellyfin plugin repo
        uses: Kevinjil/jellyfin-plugin-repo-action@v0.4.3
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
