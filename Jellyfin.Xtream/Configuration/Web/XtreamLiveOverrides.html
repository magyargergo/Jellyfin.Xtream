<div id="XtreamLivePage" data-role="page" class="page type-interior pluginConfigurationPage withTabs"
  data-require="emby-input,emby-button,emby-select" data-controller="__plugin/XtreamLiveOverrides.js">
  <div data-role="content">
    <div class="content-primary">
      <form id="XtreamLiveOverridesForm">
        <!-- Provider Selection -->
        <div class="provider-section">
          <div class="selectContainer" style="flex: 1; min-width: 200px;">
            <select is="emby-select" id="ProviderSelect" label="Provider">
              <option value="">Loading providers...</option>
            </select>
          </div>
          <button is="emby-button" type="button" id="RefreshOverrides" class="fab emby-button" title="Refresh channels">
            <span class="material-icons refresh"></span>
          </button>
        </div>

        <!-- No Provider Message -->
        <div id="NoProviderMessage" class="empty-state hide">
          <span class="material-icons">cloud_off</span>
          <p>No providers configured. Please add a provider in the <a href="/configurationpage?name=XtreamProviders.html">Providers</a> tab first.</p>
        </div>

        <!-- Channel Overrides Content -->
        <div id="ProviderContent" class="hide">
          <!-- Search Bar -->
          <div class="search-filter-bar" style="margin-bottom: 16px;">
            <div class="search-container">
              <span class="material-icons search-icon">search</span>
              <input type="text" id="OverrideSearch" class="search-input" placeholder="Search channels...">
              <button type="button" id="ClearSearch" class="clear-search hide">
                <span class="material-icons">close</span>
              </button>
            </div>
            <div class="selection-stats" id="ChannelStats">
              <span class="stat-selected" id="OverrideCount">0</span>
              <span> overrides</span>
              <span class="stat-divider"></span>
              <span class="stat-categories" id="ChannelCount">0 channels</span>
            </div>
          </div>

          <!-- Override Header -->
          <div class="override-header">
            <span>Number</span>
            <span>Name</span>
            <span>Logo URL</span>
          </div>

          <!-- Channel List -->
          <div id="LiveChannels">
            <!-- Channel rows will be dynamically inserted here -->
          </div>
        </div>

        <!-- Save Button -->
        <div style="margin-top: 24px;">
          <button is="emby-button" type="submit" class="raised button-submit block emby-button">
            <span>Save</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
