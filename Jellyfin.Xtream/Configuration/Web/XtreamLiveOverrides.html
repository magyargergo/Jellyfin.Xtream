<div id="XtreamLivePage" data-role="page" class="page type-interior pluginConfigurationPage withTabs"
  data-require="emby-input,emby-button,emby-select" data-controller="__plugin/XtreamLiveOverrides.js">
  <div data-role="content">
    <div class="content-primary">
      <form id="XtreamLiveOverridesForm">
        <div class="sectionTitleContainer flex align-items-center">
          <h2 class="sectionTitle">Provider</h2>
        </div>
        <div class="selectContainer">
          <select is="emby-select" id="ProviderSelect" label="Select Provider">
            <option value="">Loading providers...</option>
          </select>
          <div class="fieldDescription">Select a provider to configure its channel overrides.</div>
        </div>

        <div id="NoProviderMessage" class="hide" style="padding: 20px; text-align: center; color: #888;">
          <p>No providers configured. Please add a provider in the <a href="/configurationpage?name=XtreamProviders.html">Providers</a> tab first.</p>
        </div>

        <div id="ProviderContent" class="hide">
          <div class="sectionTitleContainer flex align-items-center">
            <h2 class="sectionTitle">TV channel overrides</h2>
            <button is="emby-button" type="button" id="RefreshOverrides" class="fab btnRefresh" title="Refresh channels">
              <span class="material-icons refresh"></span>
            </button>
          </div>
          <div class="inputContainer">
            <table class="overrides-table">
              <thead>
                <tr>
                  <th>Number</th>
                  <th>Name</th>
                  <th>Logo</th>
                </tr>
              </thead>
              <tbody id="LiveChannels">

              </tbody>
            </table>
          </div>
        </div>

        <div>
          <button is="emby-button" type="submit" class="raised button-submit block emby-button">
            <span>Save</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
