<div id="XtreamEpgTestPage" data-role="page" class="page type-interior pluginConfigurationPage withTabs"
  data-require="emby-input,emby-button,emby-select" data-controller="__plugin/XtreamEpgTest.js">
  <div data-role="content">
    <div class="content-primary">
      <div class="sectionTitleContainer flex align-items-center">
        <h2 class="sectionTitle">EPG Test</h2>
      </div>
      <p class="fieldDescription">
        Test the EPG (Electronic Program Guide) data retrieval for your configured channels.
        Select a channel to view its program schedule.
      </p>

      <div class="inputContainer">
        <label class="inputLabel" for="EpgProviderStatus">Provider Status</label>
        <div id="EpgProviderStatus" class="epg-provider-status">
          <span class="provider-name">Loading...</span>
          <span class="provider-availability"></span>
        </div>
      </div>

      <div class="inputContainer">
        <label class="inputLabel inputLabelUnfocused" for="ChannelSelect">Select Channel</label>
        <select is="emby-select" id="ChannelSelect" class="emby-select-withcolor">
          <option value="">-- Select a channel --</option>
        </select>
      </div>

      <div class="inputContainer" style="display: flex; gap: 10px;">
        <button is="emby-button" id="LoadEpgBtn" type="button" class="raised button-submit emby-button" disabled>
          <span>Load EPG Data</span>
        </button>
        <button is="emby-button" id="RefreshAllEpgBtn" type="button" class="raised emby-button">
          <span>Refresh All EPG (Parallel)</span>
        </button>
      </div>

      <div id="RefreshStatus" class="refresh-status" style="display: none;"></div>

      <div id="EpgResults" class="epg-results" style="display: none;">
        <div class="sectionTitleContainer flex align-items-center">
          <h3 class="sectionTitle" id="ResultsTitle">Program Schedule</h3>
        </div>
        <div id="EpgSummary" class="epg-summary"></div>
        <div class="epg-timeline" id="EpgTimeline"></div>
      </div>

      <style>
        .epg-provider-status {
          padding: 10px;
          background: rgba(0,0,0,0.1);
          border-radius: 4px;
          margin-bottom: 15px;
        }
        .epg-provider-status .provider-name {
          font-weight: bold;
        }
        .epg-provider-status .provider-availability {
          margin-left: 10px;
          padding: 2px 8px;
          border-radius: 3px;
          font-size: 0.9em;
        }
        .epg-provider-status .available {
          background: #4caf50;
          color: white;
        }
        .epg-provider-status .unavailable {
          background: #f44336;
          color: white;
        }
        .epg-summary {
          padding: 10px;
          background: rgba(0,0,0,0.1);
          border-radius: 4px;
          margin-bottom: 15px;
        }
        .epg-timeline {
          max-height: 500px;
          overflow-y: auto;
        }
        .epg-program {
          padding: 12px;
          margin-bottom: 8px;
          background: rgba(255,255,255,0.05);
          border-radius: 4px;
          border-left: 4px solid #00a4dc;
        }
        .epg-program.current {
          border-left-color: #4caf50;
          background: rgba(76, 175, 80, 0.1);
        }
        .epg-program.past {
          opacity: 0.6;
          border-left-color: #666;
        }
        .epg-program-title {
          font-weight: bold;
          font-size: 1.1em;
          margin-bottom: 4px;
        }
        .epg-program-time {
          font-size: 0.9em;
          color: #888;
          margin-bottom: 4px;
        }
        .epg-program-description {
          font-size: 0.9em;
          color: #aaa;
        }
        .epg-no-data {
          padding: 20px;
          text-align: center;
          color: #888;
        }
        .epg-error {
          padding: 15px;
          background: rgba(244, 67, 54, 0.1);
          border-left: 4px solid #f44336;
          border-radius: 4px;
          color: #f44336;
        }
        .refresh-status {
          padding: 15px;
          margin: 15px 0;
          border-radius: 4px;
          font-weight: bold;
        }
        .refresh-status.success {
          background: rgba(76, 175, 80, 0.1);
          border-left: 4px solid #4caf50;
          color: #4caf50;
        }
        .refresh-status.error {
          background: rgba(244, 67, 54, 0.1);
          border-left: 4px solid #f44336;
          color: #f44336;
        }
        .refresh-status.loading {
          background: rgba(0, 164, 220, 0.1);
          border-left: 4px solid #00a4dc;
          color: #00a4dc;
        }
      </style>
    </div>
  </div>
</div>
