<div id="XtreamEpgTestPage" data-role="page" class="page type-interior pluginConfigurationPage withTabs"
  data-require="emby-input,emby-button,emby-select" data-controller="__plugin/XtreamEpgTest.js">
  <div data-role="content">
    <div class="content-primary">
      <p class="fieldDescription" style="margin-top: 0;">
        Test the EPG (Electronic Program Guide) data retrieval for your configured channels.
        Select a channel to view its program schedule.
      </p>

      <!-- Provider Status -->
      <div class="info-card" id="ProviderStatusCard" style="background: rgba(0, 164, 220, 0.08); border-left: 3px solid #00a4dc; margin-bottom: 20px;">
        <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="material-icons" style="color: #00a4dc;">dvr</span>
            <span id="EpgProviderName" style="font-weight: 500;">Loading...</span>
          </div>
          <span id="EpgProviderStatus" class="status-badge loading">
            <span class="material-icons" style="font-size: 14px;">sync</span>
            <span>Checking...</span>
          </span>
        </div>
      </div>

      <!-- Channel Selection -->
      <div class="selectContainer" style="margin-bottom: 16px;">
        <label class="inputLabel inputLabelUnfocused" for="ChannelSelect">Select Channel</label>
        <select is="emby-select" id="ChannelSelect" class="emby-select-withcolor">
          <option value="">-- Select a channel --</option>
        </select>
      </div>

      <!-- Action Buttons -->
      <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;">
        <button is="emby-button" id="LoadEpgBtn" type="button" class="raised button-submit emby-button" disabled>
          <span class="material-icons" style="margin-right: 8px;">event_note</span>
          <span>Load EPG Data</span>
        </button>
        <button is="emby-button" id="RefreshAllEpgBtn" type="button" class="raised emby-button">
          <span class="material-icons" style="margin-right: 8px;">refresh</span>
          <span>Refresh All EPG</span>
        </button>
      </div>

      <!-- Refresh Status -->
      <div id="RefreshStatus" class="copy-result-message hide"></div>

      <!-- EPG Results -->
      <div id="EpgResults" class="hide">
        <!-- Summary Card -->
        <div id="EpgSummary" class="epg-summary-card">
          <div class="summary-title" id="ResultsTitle">Program Schedule</div>
          <div class="summary-stats">
            <div class="summary-stat">
              <span class="material-icons">event</span>
              <span id="ProgramCount">0 programs</span>
            </div>
            <div class="summary-stat">
              <span class="material-icons">tv</span>
              <span id="ProviderInfo">-</span>
            </div>
          </div>
        </div>

        <!-- Program Timeline -->
        <div id="EpgTimeline" style="max-height: 500px; overflow-y: auto;">
          <!-- Program cards will be inserted here -->
        </div>
      </div>
    </div>
  </div>
</div>
