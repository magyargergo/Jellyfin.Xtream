<div id="XtreamLogsPage" data-role="page" class="page type-interior pluginConfigurationPage withTabs"
  data-require="emby-input,emby-button,emby-select,emby-checkbox" data-controller="__plugin/XtreamLogs.js">
  <div data-role="content">
    <div class="content-primary">
      <div class="sectionTitleContainer flex align-items-center">
        <h2 class="sectionTitle">Plugin Logs</h2>
        <button is="emby-button" id="RefreshBtn" type="button" class="fab mini autoSize" title="Refresh" style="margin-left: 1em;">
          <span class="material-icons refresh"></span>
        </button>
      </div>

      <div class="debug-toggle-container">
        <label class="debug-toggle-label">
          <input is="emby-checkbox" type="checkbox" id="EnableDebugLogging" />
          <span>Enable Debug Logging</span>
        </label>
        <span class="debug-toggle-hint">Capture detailed debug messages for troubleshooting</span>
      </div>

      <div id="LogStatus" class="log-status" style="display: none;"></div>

      <div class="log-controls">
        <div class="log-filters">
          <div class="filter-group">
            <label class="filter-label">Level</label>
            <select is="emby-select" id="LogLevel" class="filter-select">
              <option value="0">All</option>
              <option value="2" selected>Info+</option>
              <option value="3">Warning+</option>
              <option value="4">Error+</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">
              <input is="emby-checkbox" type="checkbox" id="IncludeDebug" checked />
              <span>Include Debug</span>
            </label>
          </div>
          <div class="filter-group search-group">
            <span class="material-icons search-icon">search</span>
            <input is="emby-input" type="text" id="SearchText" placeholder="Search logs..." class="search-input" />
          </div>
        </div>
        <div class="log-actions">
          <button is="emby-button" id="AutoRefreshBtn" type="button" class="raised emby-button">
            <span class="material-icons">pause</span>
            <span id="AutoRefreshLabel">Auto-refresh</span>
          </button>
          <button is="emby-button" id="ClearLogsBtn" type="button" class="raised button-cancel emby-button">
            <span class="material-icons delete"></span>
            <span>Clear Logs</span>
          </button>
        </div>
      </div>

      <div id="LogStats" class="log-stats">
        <span id="StatsInfo">Loading...</span>
      </div>

      <div id="LogsContainer" class="logs-container">
        <div class="log-loading" id="LogLoading">
          <span class="material-icons">hourglass_empty</span>
          <p>Loading logs...</p>
        </div>
        <div class="no-logs" id="NoLogsMessage" style="display: none;">
          <span class="material-icons" style="font-size: 48px; opacity: 0.5;">article</span>
          <p>No log entries</p>
        </div>
        <div id="LogEntries" class="log-entries"></div>
      </div>

      <div class="log-pagination">
        <button is="emby-button" id="LoadMoreBtn" type="button" class="raised emby-button" style="display: none;">
          <span class="material-icons">expand_more</span>
          <span>Load More</span>
        </button>
      </div>

      <style>
        .log-status {
          padding: 15px;
          margin: 15px 0;
          border-radius: 4px;
          font-weight: bold;
        }
        .log-status.success {
          background: rgba(76, 175, 80, 0.1);
          border-left: 4px solid #4caf50;
          color: #4caf50;
        }
        .log-status.error {
          background: rgba(244, 67, 54, 0.1);
          border-left: 4px solid #f44336;
          color: #f44336;
        }
        .log-controls {
          display: flex;
          flex-wrap: wrap;
          justify-content: space-between;
          align-items: center;
          gap: 16px;
          margin-bottom: 16px;
          padding: 12px;
          background: rgba(255, 255, 255, 0.03);
          border-radius: 8px;
        }
        .log-filters {
          display: flex;
          flex-wrap: wrap;
          gap: 16px;
          align-items: center;
        }
        .filter-group {
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .filter-label {
          font-size: 0.9em;
          color: #888;
          display: flex;
          align-items: center;
          gap: 4px;
        }
        .filter-select {
          min-width: 100px;
        }
        .search-group {
          position: relative;
        }
        .search-group .search-icon {
          position: absolute;
          left: 8px;
          top: 50%;
          transform: translateY(-50%);
          color: #666;
          font-size: 18px;
        }
        .search-group .search-input {
          padding-left: 32px;
          min-width: 200px;
        }
        .log-actions {
          display: flex;
          gap: 8px;
        }
        .log-stats {
          padding: 8px 12px;
          background: rgba(0, 164, 220, 0.1);
          border-radius: 4px;
          margin-bottom: 16px;
          font-size: 0.9em;
          color: #888;
        }
        .logs-container {
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 8px;
          min-height: 400px;
          max-height: 600px;
          overflow-y: auto;
        }
        .log-loading, .no-logs {
          text-align: center;
          padding: 60px 20px;
          color: #888;
        }
        .log-entries {
          font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
          font-size: 12px;
        }
        .log-entry {
          display: flex;
          flex-wrap: wrap;
          padding: 8px 12px;
          border-bottom: 1px solid rgba(255, 255, 255, 0.05);
          gap: 8px;
        }
        .log-entry:hover {
          background: rgba(255, 255, 255, 0.03);
        }
        .log-entry.level-trace { border-left: 3px solid #666; }
        .log-entry.level-debug { border-left: 3px solid #2196F3; }
        .log-entry.level-info { border-left: 3px solid #4caf50; }
        .log-entry.level-warning { border-left: 3px solid #ff9800; }
        .log-entry.level-error { border-left: 3px solid #f44336; }
        .log-entry.level-critical { border-left: 3px solid #9c27b0; background: rgba(156, 39, 176, 0.1); }
        .log-entry.is-debug {
          background: rgba(33, 150, 243, 0.05);
        }
        .log-timestamp {
          color: #666;
          white-space: nowrap;
          flex-shrink: 0;
        }
        .log-level {
          font-weight: bold;
          width: 60px;
          text-align: center;
          flex-shrink: 0;
        }
        .log-level.trace { color: #666; }
        .log-level.debug { color: #2196F3; }
        .log-level.info { color: #4caf50; }
        .log-level.warning { color: #ff9800; }
        .log-level.error { color: #f44336; }
        .log-level.critical { color: #9c27b0; }
        .log-category {
          color: #00a4dc;
          width: 120px;
          flex-shrink: 0;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .log-message {
          flex: 1;
          word-break: break-word;
          min-width: 200px;
        }
        .log-meta {
          display: flex;
          gap: 8px;
          font-size: 0.9em;
          color: #888;
        }
        .log-stream-id, .log-channel-name {
          background: rgba(0, 164, 220, 0.2);
          padding: 2px 6px;
          border-radius: 4px;
        }
        .log-exception {
          width: 100%;
          margin-top: 8px;
          padding: 8px;
          background: rgba(244, 67, 54, 0.1);
          border-radius: 4px;
          color: #f44336;
          white-space: pre-wrap;
          font-size: 11px;
        }
        .log-pagination {
          margin-top: 16px;
          text-align: center;
        }
        .auto-refresh-active {
          background: #4caf50 !important;
        }
        .debug-toggle-container {
          display: flex;
          align-items: center;
          gap: 16px;
          padding: 12px 16px;
          margin-bottom: 16px;
          background: rgba(255, 152, 0, 0.1);
          border-left: 3px solid #ff9800;
          border-radius: 4px;
        }
        .debug-toggle-label {
          display: flex;
          align-items: center;
          gap: 8px;
          font-weight: 500;
          cursor: pointer;
        }
        .debug-toggle-hint {
          color: #888;
          font-size: 0.9em;
        }
      </style>
    </div>
  </div>
</div>
