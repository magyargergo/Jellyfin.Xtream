<div id="XtreamVodPage" data-role="page" class="page type-interior pluginConfigurationPage withTabs"
  data-require="emby-input,emby-button,emby-select" data-controller="__plugin/XtreamVod.js">
  <div data-role="content">
    <div class="content-primary">
      <form id="XtreamVodForm">
        <div class="checkboxContainer checkboxContainer-withDescription">
          <label>
            <input is="emby-checkbox" id="Visible" name="Visible" type="checkbox" />
            <span>Show this channel to users</span>
          </label>
        </div>
        <div class="checkboxContainer checkboxContainer-withDescription">
          <label>
            <input is="emby-checkbox" id="TmdbOverride" name="TmdbOverride" type="checkbox" />
            <span>Override metadata with TMDB</span>
          </label>
        </div>

        <div class="sectionTitleContainer flex align-items-center">
          <h2 class="sectionTitle">Provider</h2>
        </div>
        <div class="selectContainer">
          <select is="emby-select" id="ProviderSelect" label="Select Provider">
            <option value="">Loading providers...</option>
          </select>
          <div class="fieldDescription">Select a provider to configure its VOD selection.</div>
        </div>

        <div id="NoProviderMessage" class="hide" style="padding: 20px; text-align: center; color: #888;">
          <p>No providers configured. Please add a provider in the <a href="/configurationpage?name=XtreamProviders.html">Providers</a> tab first.</p>
        </div>

        <div id="ProviderContent" class="hide">
          <div class="sectionTitleContainer flex align-items-center">
            <h2 class="sectionTitle">Video On-demand selection</h2>
            <button is="emby-button" type="button" id="RefreshVod" class="fab btnRefresh" title="Refresh VOD">
              <span class="material-icons refresh"></span>
            </button>
          </div>
          <div class="inputContainer">
            <table class="categories-table">
              <thead>
                <tr>
                  <th colspan="2">Category</th>
                  <th>Display</th>
                </tr>
              </thead>
              <tbody id="VodContent">

              </tbody>
            </table>
          </div>
        </div>

        <div>
          <button is="emby-button" type="submit" class="raised button-submit block emby-button">
            <span>Save</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
