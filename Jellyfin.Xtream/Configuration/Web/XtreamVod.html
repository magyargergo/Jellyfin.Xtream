<div id="XtreamVodPage" data-role="page" class="page type-interior pluginConfigurationPage withTabs"
  data-require="emby-input,emby-button,emby-select,emby-checkbox" data-controller="__plugin/XtreamVod.js">
  <div data-role="content">
    <div class="content-primary">
      <form id="XtreamVodForm">
        <!-- Visibility Settings -->
        <div class="checkboxContainer checkboxContainer-withDescription">
          <label>
            <input is="emby-checkbox" id="Visible" name="Visible" type="checkbox" />
            <span>Show this channel to users</span>
          </label>
        </div>
        <div class="checkboxContainer checkboxContainer-withDescription">
          <label>
            <input is="emby-checkbox" id="TmdbOverride" name="TmdbOverride" type="checkbox" />
            <span>Override metadata with TMDB</span>
          </label>
          <div class="fieldDescription">
            When enabled, movie metadata will be fetched from The Movie Database (TMDB) instead of using provider data.
          </div>
        </div>

        <!-- Provider Selection -->
        <div class="provider-section">
          <div class="selectContainer" style="flex: 1; min-width: 200px;">
            <select is="emby-select" id="ProviderSelect" label="Provider">
              <option value="">Loading providers...</option>
            </select>
          </div>
          <button is="emby-button" type="button" id="RefreshVod" class="fab emby-button" title="Refresh VOD">
            <span class="material-icons refresh"></span>
          </button>
        </div>

        <!-- No Provider Message -->
        <div id="NoProviderMessage" class="empty-state hide">
          <span class="material-icons">cloud_off</span>
          <p>No providers configured. Please add a provider in the <a href="/configurationpage?name=XtreamProviders.html">Providers</a> tab first.</p>
        </div>

        <!-- VOD Selection (Card-based UI) -->
        <div id="ProviderContent" class="hide">
          <div id="VodContent">
            <!-- Search bar, stats, and category cards will be dynamically inserted here -->
          </div>
        </div>

        <!-- Save Button -->
        <div style="margin-top: 24px;">
          <button is="emby-button" type="submit" class="raised button-submit block emby-button">
            <span>Save</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
